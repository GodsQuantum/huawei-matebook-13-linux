[Unit]
# The fingerprint device must be fully enumerated before the graphical login
# manager starts.  Plasma Login Manager queries authentication capabilities at
# greeter startup; allowing it to win this race can hide fingerprint login for
# the lifetime of the greeter even though fprintd becomes ready moments later.
After=systemd-udev-trigger.service
Before=display-manager.service

[Service]
# Do not fail fingerprint auth because unrelated udev work takes unusually long.
ExecStartPre=-/usr/bin/udevadm settle --timeout=3

# Keep the normal fprintd process and its libfprint device object alive so the
# driver's validated in-process TLS/background/FDT warm state can survive Claim/Release.
ExecStart=
ExecStart=/usr/lib/fprintd --no-timeout

# A rare failed background prewarm is retried once from a full MCU reset.
# Do not let systemd kill fprintd in the middle of that bounded recovery.
TimeoutStartSec=40s

# GXFP51A0 uses the Linux GPIO character-device API for IRQ polling and reset.
DeviceAllow=char-gpiochip rw

# Warm RAM can contain TLS/key-derived material and background image data.
LimitCORE=0
