[Unit]
# fprintd is D-Bus activated by login managers and desktop settings.
# Always prepare the GXFP51A0 SPI transport first so fingerprint auth is
# available even if the early udev add event was missed during cold boot.
Requires=gxfp51a0-spidev-bind.service
After=gxfp51a0-spidev-bind.service

[Service]
# GXFP51A0 uses the Linux GPIO character-device API for IRQ polling and reset.
# Keep fprintd's upstream sandbox intact and add only gpiochip access.
DeviceAllow=char-gpiochip rw
