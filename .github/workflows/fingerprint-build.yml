name: Fingerprint candidate build

on:
  push:
    paths:
      - 'fingerprint/**'
      - 'tests/test-goodix51a0-first-contact.py'
      - 'tests/test-goodix51a0-boot-binding.py'
      - 'tests/test-fingerprint-tooling.py'
      - '.github/workflows/fingerprint-build.yml'
  pull_request:
    paths:
      - 'fingerprint/**'
      - 'tests/test-goodix51a0-first-contact.py'
      - 'tests/test-goodix51a0-boot-binding.py'
      - 'tests/test-fingerprint-tooling.py'
      - '.github/workflows/fingerprint-build.yml'

permissions:
  contents: read

jobs:
  software-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install libfprint build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git python3 python3-venv pkg-config \
            libglib2.0-dev libgusb-dev libcairo2-dev libgudev-1.0-dev \
            libssl-dev libudev-dev

      - name: Fingerprint tooling regression
        run: python3 tests/test-fingerprint-tooling.py

      - name: Guided diagnostic syntax
        run: |
          python3 -m py_compile fingerprint/tools/*.py

      - name: Bash syntax
        run: |
          bash -n fingerprint/install-arch.sh
          bash -n fingerprint/install-linux.sh
          bash -n fingerprint/uninstall-linux-source.sh
          find fingerprint/scripts fingerprint/research -type f -name '*.sh' -print0 \
            | xargs -0 -n1 bash -n

      - name: Reject private fingerprint material
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE --exclude-dir=.git \
            '(/home/[A-Za-z0-9._-]+|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})' \
            fingerprint
          ! find fingerprint -type f \
            \( -name '*.raw' -o -name '*.pgm' -o -name '*.npy' -o -name '*.pkg.tar.*' \) \
            -print -quit | grep -q .

      - name: Software tests and reproducible libfprint build
        run: make -C fingerprint verify

      - name: Prove public scripts contain no active hardware action
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE \
            '(/sys/.*/(bind|unbind)|modprobe|rmmod|SPI_IOC_MESSAGE|gpiod_line_request_output|gpioset)' \
            fingerprint/scripts

  portable-build-matrix:
    name: Portable build — ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian stable
            image: debian:stable
          - name: Fedora current
            image: fedora:latest
          - name: openSUSE Tumbleweed
            image: opensuse/tumbleweed:latest
          - name: Arch Linux
            image: archlinux:latest
          - name: Alpine edge
            image: alpine:edge
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Bootstrap checkout runtime
        shell: sh
        run: |
          set -eu
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y git ca-certificates
          elif command -v dnf >/dev/null; then
            dnf install -y git ca-certificates
          elif command -v zypper >/dev/null; then
            zypper --non-interactive install git ca-certificates
          elif command -v pacman >/dev/null; then
            pacman -Sy --needed --noconfirm git ca-certificates
          elif command -v apk >/dev/null; then
            apk add --no-cache git ca-certificates bash
          else
            echo "Unsupported CI container" >&2
            exit 1
          fi

      - name: Checkout (glibc containers)
        if: matrix.name != 'Alpine edge'
        uses: actions/checkout@v5

      - name: Checkout (Alpine/musl)
        if: matrix.name == 'Alpine edge'
        shell: sh
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "https://github.com/$REPOSITORY.git"
          git fetch --depth=1 origin "$COMMIT_SHA"
          git checkout --detach FETCH_HEAD

      - name: Build through portable installer
        shell: bash
        run: |
          set -euo pipefail
          ./fingerprint/install-linux.sh --build-only

      - name: Verify portable installer contracts
        shell: bash
        run: |
          set -euo pipefail
          bash fingerprint/research/tests/test_portable_installer_source_safety.sh
          bash fingerprint/research/tests/test_session_local_timing_source_safety.sh
